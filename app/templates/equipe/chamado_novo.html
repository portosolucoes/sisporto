{% extends "base.html" %}
{% block titulo %}Novo chamado{% endblock %}
{% block conteudo %}
<div class="topo"><h1>Novo chamado</h1></div>
<form method="post" class="card" style="max-width:820px">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <div class="grid g2">
    <div class="campo"><label for="cliente_id">Cliente</label><select id="cliente_id" name="cliente_id" required><option value="">Escolha…</option>
      {% for c in clientes %}<option value="{{ c.id }}" {{ 'selected' if form.cliente_id == c.id|string }}>{{ c.nome }}</option>{% endfor %}</select></div>
    <div class="campo"><label for="solicitante_id">Solicitante</label><select id="solicitante_id" name="solicitante_id"><option value="">Eu mesmo (aberto pela equipe)</option>
      {% for u in contatos %}<option value="{{ u.id }}" data-cliente="{{ u.cliente_id }}" {{ 'selected' if form.solicitante_id == u.id|string }}>{{ u.nome }}</option>{% endfor %}</select></div>
    <div class="campo"><label for="contrato_id">Contrato</label><select id="contrato_id" name="contrato_id"><option value="">Automático (contrato único do cliente)</option>
      {% for ct in contratos %}<option value="{{ ct.id }}" data-cliente="{{ ct.cliente_id }}" {{ 'selected' if form.contrato_id == ct.id|string }}>{{ ct.descricao }} ({{ ct.tipo|rotulo('tipo_contrato') }})</option>{% endfor %}</select></div>
    <div class="campo"><label>Prioridade</label><select name="prioridade">
      {% for p in prioridades %}<option value="{{ p }}" {{ 'selected' if (form.prioridade or 'media') == p }}>{{ p|rotulo('prioridade') }}</option>{% endfor %}</select></div>
    <div class="campo"><label>Responsável</label><select name="responsavel_id"><option value="">Ninguém ainda</option>
      {% for t in tecnicos %}<option value="{{ t.id }}" {{ 'selected' if form.responsavel_id == t.id|string }}>{{ t.nome }}</option>{% endfor %}</select></div>
    <div class="campo"><label>Categoria</label><input type="text" name="categoria" value="{{ form.categoria }}" placeholder="Ex.: Rede, Impressora, E-mail"></div>
  </div>
  <div class="campo"><label>Título</label><input type="text" name="titulo" value="{{ form.titulo }}" required maxlength="200"></div>
  <div class="campo"><label>Descrição</label><textarea name="descricao" required>{{ form.descricao }}</textarea></div>
  <button class="btn">Abrir chamado</button> <a class="btn sec" href="{{ url_for('equipe.chamados') }}">Cancelar</a>
</form>
{% endblock %}
