{% extends "base.html" %}
{% block titulo %}Entrar{% endblock %}
{% block publico %}
<div class="login"><div class="caixa">
  <div class="marca"><img src="{{ url_for('logo') }}" alt="Porto Soluções Corporativas" style="max-height:72px;max-width:280px"></div>
  <div class="card">
    <h2>Entrar no SisPorto</h2>
    {% include "_avisos.html" %}
    {% if google %}
      <a class="btn" style="display:block;text-align:center" href="{{ url_for('auth.google_inicio') }}">Entrar com Google (equipe Porto)</a>
      <div class="ou">ou, para clientes</div>
    {% endif %}
    <form method="post">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <div class="campo"><label for="email">E-mail</label><input id="email" type="email" name="email" required autocomplete="username" autofocus></div>
      <div class="campo"><label for="senha">Senha</label><input id="senha" type="password" name="senha" required autocomplete="current-password"></div>
      <button class="btn" style="width:100%">Entrar</button>
    </form>
  </div>
  <p class="muted small" style="text-align:center">Esqueceu a senha? Fale com o suporte da Porto Soluções.</p>
</div></div>
{% endblock %}
