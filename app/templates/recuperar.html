{% extends "base.html" %}
{% block titulo %}Recuperar senha{% endblock %}
{% block publico %}
<div class="login"><div class="caixa">
  <div class="marca"><img src="{{ url_for('logo') }}" alt="Porto Soluções Corporativas" style="max-height:72px;max-width:280px"></div>
  <div class="card">
    <h2>Recuperar senha</h2>
    {% include "_avisos.html" %}
    <p class="muted">Informe seu e-mail. Enviaremos um link para você criar uma nova senha.</p>
    <form method="post">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <div class="campo"><label for="email">E-mail</label><input id="email" type="email" name="email" value="{{ email }}" required autofocus autocomplete="username"></div>
      <button class="btn" style="width:100%">Enviar link</button>
    </form>
  </div>
  <p class="small" style="text-align:center"><a href="{{ url_for('auth.login') }}">Voltar ao login</a></p>
</div></div>
{% endblock %}
