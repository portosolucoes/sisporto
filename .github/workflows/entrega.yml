# Entrega por zip: suba o arquivo sisporto-vX.Y.Z.zip na raiz do repositório (Add file > Upload files).
# Este fluxo confere o pacote, aplica os arquivos, apaga o zip, testa e publica sozinho.
name: Aplicar entrega (zip)
on:
  push:
    branches: [main]
    paths: ["sisporto-*.zip", "entregas/*.zip"]
permissions:
  contents: write
  id-token: write
concurrency:
  group: publicar-sisporto
  cancel-in-progress: false
jobs:
  aplicar:
    name: Aplicar o pacote
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Conferir e aplicar
        run: |
          set -euo pipefail
          ZIP=$(ls -t sisporto-*.zip entregas/*.zip 2>/dev/null | head -1 || true)
          if [ -z "$ZIP" ]; then echo "Nenhum zip encontrado."; exit 1; fi
          echo "Pacote: $ZIP"
          mkdir -p /tmp/entrega && unzip -q "$ZIP" -d /tmp/entrega
          (cd /tmp/entrega && sha256sum --quiet -c MANIFESTO.sha256)
          git rm -q --ignore-unmatch -- 'sisporto-*.zip' 'entregas/*.zip'
          # espelha o pacote (remove arquivos que saíram da versão); os fluxos do GitHub ficam como estão
          rsync -a --delete --exclude .git --exclude .github /tmp/entrega/ ./
          VERSAO=$(sed -n 's/^VERSAO = "\(.*\)"/\1/p' app/__init__.py)
          git config user.name "SisPorto (entrega automática)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Versão $VERSAO (aplicada de $ZIP)" || echo "Nada mudou."
          git push
          echo "### SisPorto $VERSAO aplicado a partir de $ZIP" >> "$GITHUB_STEP_SUMMARY"
  publicar:
    needs: aplicar
    uses: ./.github/workflows/publicar.yml
    with:
      ref: main
    permissions:
      contents: read
      id-token: write
